name: Deploy to Cloudflare Pages

# 每日 sync-metadata（03:00 UTC）提交数据后 push 触发；
# 任何推到 main 的内容变更也会自动部署；也可手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署排队执行，不并行
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # secrets 只能在 env 里读取，不能放进 if——先探测再门控
      - name: Check for Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN not set - deploy steps will be skipped"
          fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.available == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.available == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dad5acc42b3eb97b72f90f9c825339fe
          command: pages deploy dist --project-name openmac --branch main
