<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Concept A: Open Command — ⌘ with the east loop broken open (green) -->
  <g stroke="#e8e8e8" stroke-width="10" stroke-linecap="round">
    <line x1="64" y1="28" x2="64" y2="100"/>
    <line x1="28" y1="64" x2="100" y2="64"/>
    <circle cx="64" cy="28" r="14"/>
    <circle cx="28" cy="64" r="14"/>
    <circle cx="64" cy="100" r="14"/>
  </g>
  <!-- east loop open (290° arc, gap faces outward), concentric with r=14 @ (100,64):
       endpoints at ±35°: (111.47, 56.0) and (111.47, 72.0) -->
  <path d="M 111.47 56.0 A 14 14 0 1 0 111.47 72.0"
        stroke="#2ec48f" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
