<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Concept D v2: '84 all-in-one — beefed-up screen content for 32px legibility -->
  <g fill="#e8e8e8">
    <rect x="1" y="1" width="14" height="1"/>
    <rect x="1" y="13" width="14" height="1"/>
    <rect x="1" y="1" width="1" height="13"/>
    <rect x="14" y="1" width="1" height="13"/>
    <rect x="3" y="3" width="10" height="1"/>
    <rect x="3" y="10" width="10" height="1"/>
    <rect x="3" y="3" width="1" height="8"/>
    <rect x="12" y="3" width="1" height="8"/>
    <rect x="5" y="11" width="6" height="1"/>
  </g>
  <!-- screen: bold prompt (2px arrow + 2px cursor) -->
  <g fill="#2ec48f">
    <rect x="4" y="4" width="2" height="1"/>
    <rect x="5" y="5" width="2" height="1"/>
    <rect x="4" y="6" width="2" height="1"/>
    <rect x="7" y="6" width="3" height="1"/>
  </g>
</svg>
