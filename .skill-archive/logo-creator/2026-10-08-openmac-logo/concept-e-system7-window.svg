<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Concept E: System 7 window — zebra title bar, close box, open prompt -->
  <g fill="#e8e8e8">
    <!-- title bar stripes (System 7 window lines) -->
    <rect x="1" y="1" width="14" height="1"/>
    <rect x="1" y="3" width="14" height="1"/>
    <!-- close box (left) -->
    <rect x="2" y="1" width="1" height="3"/>
    <!-- window outline below title bar -->
    <rect x="1" y="4" width="14" height="1"/>
    <rect x="1" y="14" width="14" height="1"/>
    <rect x="1" y="4" width="1" height="11"/>
    <rect x="14" y="4" width="1" height="11"/>
  </g>
  <!-- content: green prompt -->
  <g fill="#2ec48f">
    <rect x="4" y="7" width="1" height="1"/>
    <rect x="5" y="8" width="1" height="1"/>
    <rect x="4" y="9" width="1" height="1"/>
    <rect x="7" y="9" width="3" height="1"/>
  </g>
</svg>
