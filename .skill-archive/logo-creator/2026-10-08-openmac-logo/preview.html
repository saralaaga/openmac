<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OpenMac retro concepts</title>
<style>
  body { background: #23262b; color: #d5d8de; font-family: ui-monospace, "SF Mono", Menlo, monospace; margin: 0; padding: 40px; }
  h1 { font-size: 16px; color: #f2f2f2; }
  .grid { display: flex; gap: 48px; flex-wrap: wrap; }
  .concept h2 { font-size: 13px; color: #8b929e; margin: 8px 0 16px; }
  .row { display: flex; align-items: center; gap: 28px; }
  img.big { width: 128px; height: 128px; image-rendering: pixelated; display: block; }
  img.mid { width: 64px; height: 64px; image-rendering: pixelated; display: block; }
  img.tiny { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
  .lockup { display: flex; align-items: center; gap: 10px; margin-top: 20px; font-size: 22px; font-weight: 700; color: #f2f2f2; }
  .lockup img { width: 28px; height: 28px; image-rendering: pixelated; display: block; }
  .lockup span { color: #8b929e; font-weight: 400; font-size: 16px; }
  .old h2, .old .row { opacity: 0.35; }
  .old { order: 99; }
</style>
</head>
<body>
  <h1>OpenMac · retro Mac pass — 1-bit pixel language (16×16 grid), sizes 128 / 64 / 32 + lockup</h1>
  <div class="grid">
    <div class="concept">
      <h2>D · '84 all-in-one, green prompt</h2>
      <div class="row"><img class="big" src="concept-d-retro-mac.svg"><img class="mid" src="concept-d-retro-mac.svg"><img class="tiny" src="concept-d-retro-mac.svg"></div>
      <div class="lockup"><img src="concept-d-retro-mac.svg">OpenMac<span>.dev</span></div>
    </div>
    <div class="concept">
      <h2>E · System 7 window</h2>
      <div class="row"><img class="big" src="concept-e-system7-window.svg"><img class="mid" src="concept-e-system7-window.svg"><img class="tiny" src="concept-e-system7-window.svg"></div>
      <div class="lockup"><img src="concept-e-system7-window.svg">OpenMac<span>.dev</span></div>
    </div>
    <div class="concept">
      <h2>F · Happy boot smiley, open corner</h2>
      <div class="row"><img class="big" src="concept-f-happy-boot.svg"><img class="mid" src="concept-f-happy-boot.svg"><img class="tiny" src="concept-f-happy-boot.svg"></div>
      <div class="lockup"><img src="concept-f-happy-boot.svg">OpenMac<span>.dev</span></div>
    </div>
    <div class="concept old">
      <h2>prev · A open command</h2>
      <div class="row"><img class="big" src="concept-a-open-command.svg"><img class="mid" src="concept-a-open-command.svg"><img class="tiny" src="concept-a-open-command.svg"></div>
    </div>
  </div>
</body>
</html>
